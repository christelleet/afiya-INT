<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Dein Feedback – Afiya</title>
  <link rel="icon" href="images/favicon.ico">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #006B7A;
      --primary-900: #004E59;
      --mint: #D6F2F1;
      --bg: #FBFBFA;
      --text: #0B0B0F;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, rgba(214,242,241,0.3) 0%, rgba(0,107,122,0.05) 100%), var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 40px 20px;
      -webkit-font-smoothing: antialiased;
    }
    
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(11,11,15,0.08);
      overflow: hidden;
      animation: slideUp 0.5s ease-out;
    }
    
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .header {
      background: linear-gradient(180deg, rgba(214,242,241,0.4) 0%, rgba(255,255,255,0) 100%);
      padding: 40px 32px 32px;
      text-align: center;
    }
    
    .logo {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      margin: 0 auto 16px;
      display: block;
    }
    
    h1 {
      font-family: 'Sora', sans-serif;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      color: var(--text);
    }
    
    .subtitle {
      font-size: 16px;
      color: rgba(11,11,15,0.68);
      line-height: 1.5;
    }
    
    .event-photo-wrapper {
      padding: 0 32px 24px;
    }
    
    .event-photo-label {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: rgba(11,11,15,0.60);
      text-align: center;
      margin-bottom: 12px;
    }
    
    .event-photo {
      width: 100%;
      border-radius: 16px;
      border: 1px solid rgba(11,11,15,0.06);
      display: block;
    }
    
    .form-section {
      padding: 0 32px 40px;
    }
    
    .rating-display {
      background: linear-gradient(135deg, #D6F2F1 0%, rgba(0,107,122,0.08) 100%);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      margin-bottom: 32px;
      border: 1px solid rgba(0,107,122,0.12);
    }
    
    .rating-label {
      font-size: 14px;
      font-weight: 600;
      color: rgba(11,11,15,0.68);
      margin-bottom: 8px;
    }
    
    .stars {
      font-size: 36px;
      line-height: 1;
      margin-bottom: 8px;
    }
    
    .rating-text {
      font-size: 15px;
      font-weight: 600;
      color: var(--primary);
    }
    
    .form-group {
      margin-bottom: 24px;
    }
    
    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }
    
    .optional {
      font-weight: 400;
      color: rgba(11,11,15,0.50);
      font-size: 13px;
    }
    
    input, textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid rgba(11,11,15,0.12);
      border-radius: 12px;
      font-family: inherit;
      font-size: 15px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0,107,122,0.12);
    }
    
    textarea {
      resize: vertical;
      min-height: 100px;
      line-height: 1.6;
    }
    
    .checkbox-wrapper {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: rgba(0,107,122,0.04);
      padding: 16px;
      border-radius: 12px;
      border: 1px solid rgba(0,107,122,0.08);
      margin-bottom: 24px;
    }
    
    input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-top: 2px;
      cursor: pointer;
      accent-color: var(--primary);
    }
    
    .checkbox-label {
      flex: 1;
      font-size: 14px;
      line-height: 1.5;
      color: rgba(11,11,15,0.76);
      cursor: pointer;
    }
    
    .btn {
      width: 100%;
      padding: 15px 24px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 650;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 16px rgba(0,107,122,0.20);
    }
    
    .btn:hover {
      background: var(--primary-900);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,107,122,0.30);
    }
    
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    .result {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      font-size: 15px;
      text-align: center;
    }
    
    .result.success {
      background: rgba(34,197,94,0.1);
      color: #059669;
      border: 1px solid rgba(34,197,94,0.2);
    }
    
    .result.error {
      background: rgba(239,68,68,0.1);
      color: #dc2626;
      border: 1px solid rgba(239,68,68,0.2);
    }
    
    .footer {
      background: #F8F8F7;
      padding: 24px 32px;
      text-align: center;
      border-top: 1px solid rgba(11,11,15,0.06);
      font-size: 13px;
      color: rgba(11,11,15,0.60);
    }
    
    @media (max-width: 640px) {
      body { padding: 20px 12px; }
      .header { padding: 32px 24px 24px; }
      h1 { font-size: 24px; }
      .form-section { padding: 0 24px 32px; }
      .event-photo-wrapper { padding: 0 24px 20px; }
    }
  </style>
</head>
<body>
  
  <div class="container">
    <!-- Header -->
    <div class="header">
      <img src="images/logo.png" alt="Afiya" class="logo">
      <h1>Dein Feedback 💚</h1>
      <p class="subtitle">Danke, dass du dir Zeit nimmst!</p>
    </div>
    
    <!-- Event Photo -->
    <div class="event-photo-wrapper">
      <div class="event-photo-label" id="eventLabel">Event</div>
      <img src="images/galentine_group.jpeg" alt="Event" class="event-photo" id="eventPhoto">
    </div>
    
    <!-- Form -->
    <div class="form-section">
      <form id="feedbackForm">
        <!-- Hidden fields -->
        <input type="hidden" name="access_key" value="e43ac581-1b6c-4278-abb3-1fa8d3976009">
        <input type="hidden" name="subject" value="Neues Event-Feedback">
        <input type="hidden" name="from_name" value="Afiya Feedback">
        <input type="checkbox" name="botcheck" style="display: none;">
        
        <!-- Event Name (hidden, auto-filled) -->
        <input type="hidden" name="event" id="eventName">
        
        <!-- Rating Display -->
        <div class="rating-display">
          <div class="rating-label">Deine Bewertung</div>
          <div class="stars" id="starDisplay">⭐⭐⭐⭐⭐</div>
          <div class="rating-text" id="ratingText">5 Sterne</div>
        </div>
        <input type="hidden" name="rating" id="ratingValue">
        
        <!-- Name -->
        <div class="form-group">
          <label for="name">Dein Vorname</label>
          <input type="text" id="name" name="name" required placeholder="z.B. Sarah">
        </div>
        
        <!-- Positive Feedback -->
        <div class="form-group">
          <label for="positive">
            Was hat dir besonders gefallen? 
            <span class="optional">(optional)</span>
          </label>
          <textarea id="positive" name="positive" placeholder="z.B. Die Location war super, tolle Gespräche..."></textarea>
        </div>
        
        <!-- Improvements -->
        <div class="form-group">
          <label for="improvements">
            Verbesserungsvorschläge? 
            <span class="optional">(optional)</span>
          </label>
          <textarea id="improvements" name="improvements" placeholder="z.B. Etwas mehr Zeit für Networking..."></textarea>
        </div>
        
        <!-- Publish Consent -->
        <div class="checkbox-wrapper">
          <input type="checkbox" id="publish" name="publish" value="Ja" checked>
          <label for="publish" class="checkbox-label">
            <strong>Ja, mein Feedback darf auf afiya.ch veröffentlicht werden.</strong><br>
            <span style="font-size: 13px; color: rgba(11,11,15,0.60);">Dein Name wird dabei anonymisiert (z.B. "Sarah M.")</span>
          </label>
        </div>
        
        <!-- Submit -->
        <button type="submit" class="btn" id="submitBtn">
          Feedback absenden
        </button>
        
        <div id="result" class="result" style="display: none;"></div>
      </form>
    </div>
    
    <!-- Footer -->
    <div class="footer">
      Afiya – Moments that matter · <a href="https://afiya.ch" style="color: var(--primary); text-decoration: none;">afiya.ch</a>
    </div>
  </div>
  
  <script>
    // Get URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const rating = urlParams.get('rating') || '5';
    const event = urlParams.get('event') || 'Event';
    const eventDate = urlParams.get('date') || '';
    
    // Set event name
    document.getElementById('eventName').value = event + (eventDate ? ' (' + eventDate + ')' : '');
    document.getElementById('eventLabel').textContent = event.toUpperCase();
    
    // Set rating display
    const ratingInt = parseInt(rating);
    document.getElementById('ratingValue').value = ratingInt;
    
    const starEmojis = '⭐'.repeat(ratingInt);
    document.getElementById('starDisplay').textContent = starEmojis;
    
    const ratingTexts = {
      1: '1 Stern',
      2: '2 Sterne',
      3: '3 Sterne',
      4: '4 Sterne',
      5: '5 Sterne'
    };
    document.getElementById('ratingText').textContent = ratingTexts[ratingInt] || '5 Sterne';
    
    // Set event photo based on event name
    const eventPhotos = {
      'galentine': 'images/galentine_group.jpeg',
      'femme friday': 'images/femme-friday.jpg',
      'dinner & talk': 'images/DinnerAndTalk.jpg',
      'default': 'images/galentine_group.jpeg'
    };
    
    const eventLower = event.toLowerCase();
    let photoSrc = eventPhotos.default;
    for (const [key, value] of Object.entries(eventPhotos)) {
      if (eventLower.includes(key)) {
        photoSrc = value;
        break;
      }
    }
    document.getElementById('eventPhoto').src = photoSrc;
    
    // Form submission
    const form = document.getElementById('feedbackForm');
    const submitBtn = document.getElementById('submitBtn');
    const result = document.getElementById('result');
    
    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      
      // Disable button
      submitBtn.disabled = true;
      submitBtn.textContent = 'Wird gesendet...';
      
      // Prepare form data
      const formData = new FormData(form);
      
      // Add publish value correctly
      if (!formData.get('publish')) {
        formData.set('publish', 'Nein');
      }
      
      const object = Object.fromEntries(formData);
      const json = JSON.stringify(object);
      
      try {
        const response = await fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: json
        });
        
        const data = await response.json();
        
        if (response.status === 200) {
          result.className = 'result success';
          result.textContent = '✅ Vielen Dank für dein Feedback!';
          result.style.display = 'block';
          form.reset();
          
          // Redirect after 2 seconds
          setTimeout(() => {
            window.location.href = 'https://afiya.ch';
          }, 2000);
        } else {
          throw new Error(data.message);
        }
      } catch (error) {
        result.className = 'result error';
        result.textContent = '❌ Fehler beim Senden. Bitte versuche es erneut.';
        result.style.display = 'block';
        
        submitBtn.disabled = false;
        submitBtn.textContent = 'Feedback absenden';
      }
    });
  </script>
  
</body>
</html>
